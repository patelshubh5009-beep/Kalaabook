<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KalaaBook Artist Portal</title>

  <script>
    const SUPABASE_URL = 'https://pmerqsrmgmlqirznegeb.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_QreawwcE_0ebjswoBAHrig_IxzryR5p';
  </script>

  <style>

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#12091a;
      color:#fff;
    }

    .portal{
      max-width:700px;
      margin:0 auto;
      padding:40px 20px;
    }

    h1{
      font-size:30px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#b9aabd;
      margin-bottom:30px;
    }

    .card{
      background:#1c1026;
      border:1px solid rgba(227,178,78,.25);
      border-radius:18px;
      padding:24px;
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:600;
    }

    input,
    textarea{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      margin-bottom:18px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.2);
      background:#261631;
      color:#fff;
      font-size:14px;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    input[type="file"]{
      padding:10px;
      background:#261631;
      cursor:pointer;
    }

    .upload-info{
      color:#b9aabd;
      font-size:12px;
      margin-top:-10px;
      margin-bottom:18px;
    }

    button{
      width:100%;
      padding:14px;
      border:0;
      border-radius:12px;
      background:#E3B24E;
      color:#160b1d;
      font-weight:700;
      cursor:pointer;
      font-size:15px;
    }

    button:hover{
      opacity:.9;
    }

    .message{
      margin-top:15px;
      text-align:center;
      font-size:14px;
      display:none;
    }

    .artist-info{
      padding:14px;
      background:#261631;
      border-radius:12px;
      margin-bottom:20px;
      color:#ddd;
      line-height:1.6;
    }

    .success{
      color:#7ee787;
    }

    .error{
      color:#ff8a8a;
    }

  </style>

</head>

<body>

  <div class="portal">

    <h1>KalaaBook Artist Portal</h1>

    <p class="subtitle">
      Complete your artist profile and upload your portfolio.
    </p>

    <div class="card">

      <div
        id="artistInfo"
        class="artist-info"
        style="display:none;"
      ></div>


      <label for="artistName">
        Artist Name
      </label>

      <input
        id="artistName"
        type="text"
        placeholder="Your name"
      >


      <label for="profilePhoto">
        Profile Photo
      </label>

      <input
        id="profilePhoto"
        type="file"
        accept="image/*"
      >

      <div class="upload-info">
        Please upload 1 clear photo of yourself.
      </div>


      <label for="portfolioPhotos">
        Portfolio Photos
      </label>

      <input
        id="portfolioPhotos"
        type="file"
        accept="image/*"
        multiple
      >

      <div class="upload-info">
        Upload up to 6 of your best work photos.
      </div>


      <label for="artistBio">
        Bio
      </label>

      <textarea
        id="artistBio"
        placeholder="Tell customers about your work"
      ></textarea>


      <label for="artistServices">
        Services
      </label>

      <input
        id="artistServices"
        type="text"
        placeholder="Example: Nail Extension, Gel Nails, Nail Art"
      >


      <label for="artistInstagram">
        Instagram
      </label>

      <input
        id="artistInstagram"
        type="text"
        placeholder="Instagram username"
      >


      <button
        type="button"
        onclick="saveProfile()"
      >
        Submit Profile
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>


  <script>

    let artistId = null;
    let uploadToken = null;


    /*
      Get artist ID from URL.

      Example:
      artist.html?id=123
    */

   function getUploadToken(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get('token');

}

    /*
      Escape text before displaying it.
    */

    function escapeHtml(text){

      return String(text || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

    }


    /*
      Load the artist information.
    */

    async function loadArtist(){

      uploadToken = getUploadToken();


if(!uploadToken){

  alert(
    'This artist upload link is invalid or incomplete.'
  );

  return;

}


      try{

        const response = await fetch(

          SUPABASE_URL +
         '/rest/v1/artist_applications?upload_token=eq.' +
encodeURIComponent(uploadToken) +
'&select=*',

          {

            headers:{
              'apikey':SUPABASE_KEY,
              'Authorization':
                'Bearer ' + SUPABASE_KEY
            }

          }

        );


        if(!response.ok){

          throw new Error(
            'Could not load artist.'
          );

        }


        const artists =
          await response.json();


        if(!artists.length){

          throw new Error(
            'Artist not found.'
          );

        }


        const artist = artists[0];


        document.getElementById('artistName').value =
          artist.full_name || '';


        document.getElementById('artistBio').value =
          artist.notes || '';


        document.getElementById('artistInstagram').value =
          artist.portfolio || '';


        if(
          artist.services &&
          Array.isArray(artist.services)
        ){

          document.getElementById('artistServices').value =
            artist.services.join(', ');

        }


        const info =
          document.getElementById('artistInfo');


        info.innerHTML =
          '<strong>Welcome, ' +
          escapeHtml(artist.full_name) +
          '!</strong><br>' +
          'Category: ' +
          escapeHtml(artist.category || 'Artist') +
          '<br>' +
          'Please complete your profile below.';


        info.style.display='block';


      }catch(error){

        console.error(error);

        alert(
          'We could not load your artist profile.'
        );

      }

    }


    /*
      Upload one image to Supabase Storage.
    */

    async function uploadImage(file, path){

      const uploadResponse =
        await fetch(

          SUPABASE_URL +
          '/storage/v1/object/artist-photos/' +
          path,

          {

            method:'POST',

            headers:{

              'apikey':SUPABASE_KEY,

              'Authorization':
                'Bearer ' + SUPABASE_KEY,

              'Content-Type':
                file.type

            },

            body:file

          }

        );


      if(!uploadResponse.ok){

        const errorText =
          await uploadResponse.text();

        console.error(
          'Upload error:',
          errorText
        );

        throw new Error(
          'Photo upload failed.'
        );

      }


      return (

        SUPABASE_URL +
        '/storage/v1/object/public/artist-photos/' +
        path

      );

    }


    /*
      Save the artist profile.
    */

    async function saveProfile(){

      const name =
        document.getElementById('artistName').value.trim();


      const bio =
        document.getElementById('artistBio').value.trim();


      const servicesText =
        document.getElementById('artistServices').value.trim();


      const instagram =
        document.getElementById('artistInstagram').value.trim();


      const profileInput =
        document.getElementById('profilePhoto');


      const portfolioInput =
        document.getElementById('portfolioPhotos');


      const message =
        document.getElementById('message');


      if(!artistId){

        alert(
          'This artist link is missing the artist ID.'
        );

        return;

      }


      if(!name){

        alert(
          'Please enter your artist name.'
        );

        return;

      }


      const profileFile =
        profileInput.files[0];


      const portfolioFiles =
        Array.from(
          portfolioInput.files
        );


      if(portfolioFiles.length > 6){

        alert(
          'Please upload a maximum of 6 portfolio photos.'
        );

        return;

      }


      const services = servicesText

        ? servicesText
            .split(',')
            .map(function(service){
              return service.trim();
            })
            .filter(Boolean)

        : [];


      message.style.display='block';
      message.className='message';
      message.textContent=
        'Uploading your profile...';


      try{

        let profilePhotoUrl = null;


        /*
          Upload profile photo
        */

        if(profileFile){

          const safeName =
            profileFile.name
              .replace(/[^a-zA-Z0-9._-]/g,'-');


          const path =
            'artists/' +
            artistId +
            '/profile-' +
            Date.now() +
            '-' +
            safeName;


          profilePhotoUrl =
            await uploadImage(
              profileFile,
              path
            );

        }


        /*
          Upload portfolio photos
        */

        const portfolioUrls=[];


        for(
          let i=0;
          i<portfolioFiles.length;
          i++
        ){

          message.textContent =
            'Uploading portfolio photo ' +
            (i+1) +
            ' of ' +
            portfolioFiles.length +
            '...';


          const file =
            portfolioFiles[i];


          const safeName =
            file.name
              .replace(/[^a-zA-Z0-9._-]/g,'-');


          const path =
            'artists/' +
            artistId +
            '/portfolio-' +
            Date.now() +
            '-' +
            i +
            '-' +
            safeName;


          const url =
            await uploadImage(
              file,
              path
            );


          portfolioUrls.push(url);

        }


        /*
          Get existing portfolio photos.
        */

        let existingPhotos=[];


        const existingResponse =
          await fetch(

            SUPABASE_URL +
            '/rest/v1/artist_applications?id=eq.' +
            encodeURIComponent(artistId) +
            '&select=portfolio_photos',

            {

              headers:{
                'apikey':SUPABASE_KEY,
                'Authorization':
                  'Bearer ' + SUPABASE_KEY
              }

            }

          );


        if(existingResponse.ok){

          const existingData =
            await existingResponse.json();


          if(
            existingData.length &&
            Array.isArray(
              existingData[0].portfolio_photos
            )
          ){

            existingPhotos =
              existingData[0].portfolio_photos;

          }

        }


        /*
          Combine old and new portfolio photos.
        */

        const combinedPhotos =
          existingPhotos
            .concat(portfolioUrls);


        /*
          Maximum 6 total portfolio photos.
        */

        if(combinedPhotos.length > 6){

          throw new Error(
            'You can have a maximum of 6 portfolio photos.'
          );

        }


        /*
          Prepare database update.
        */

        const updateData={

          notes:bio,

          services:services,

          portfolio:instagram

        };


        if(profilePhotoUrl){

          updateData.profile_photo =
            profilePhotoUrl;

        }


        if(portfolioUrls.length){

          updateData.portfolio_photos =
            combinedPhotos;

        }


        message.textContent =
          'Saving your profile...';


        /*
          Update Supabase.
        */

        const response =
          await fetch(

            SUPABASE_URL +
            '/rest/v1/artist_applications?upload_token=eq.' +
encodeURIComponent(uploadToken),
            encodeURIComponent(artistId),

            {

              method:'PATCH',

              headers:{

                'apikey':SUPABASE_KEY,

                'Authorization':
                  'Bearer ' + SUPABASE_KEY,

                'Content-Type':
                  'application/json',

                'Prefer':
                  'return=minimal'

              },

              body:
                JSON.stringify(
                  updateData
                )

            }

          );


        if(!response.ok){

          const errorText =
            await response.text();

          console.error(
            'Supabase error:',
            errorText
          );

          throw new Error(
            'Profile could not be saved.'
          );

        }


        message.className =
          'message success';

        message.textContent =
          'Profile submitted successfully!';


        alert(
          'Profile submitted successfully!'
        );


        /*
          Clear uploaded file inputs.
        */

        profileInput.value='';

        portfolioInput.value='';


      }catch(error){

        console.error(error);


        message.className =
          'message error';

        message.textContent =
          error.message ||
          'Could not save profile. Please try again.';


        alert(
          error.message ||
          'Could not save profile. Please try again.'
        );

      }

    }


    /*
      Load artist when page opens.
    */

    loadArtist();

  </script>

</body>
</html>
