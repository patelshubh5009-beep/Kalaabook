<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KalaaBook Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:22px;
}

button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:600;
  margin:3px;
}

.green{
  background:#198754;
  color:white;
}

.red{
  background:#dc3545;
  color:white;
}

.primary{
  background:#2563eb;
  color:white;
}

.gray{
  background:#777;
  color:white;
}

.card{
  background:white;
  margin:20px auto;
  padding:20px;
  border-radius:12px;
  max-width:1400px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.login{
  max-width:420px;
  margin:80px auto;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:14px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  font-weight:600;
  display:block;
  margin-top:8px;
}

.message{
  margin-top:10px;
  font-weight:600;
}

.hidden{
  display:none;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid #ddd;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f1f1f1;
}

.status{
  font-weight:bold;
}

.status.approved{
  color:#198754;
}

.status.rejected{
  color:#dc3545;
}

.status.pending{
  color:#d97706;
}

.actions{
  min-width:260px;
}

.small{
  font-size:12px;
  color:#666;
}

.photo-input{
  margin-top:8px;
  width:220px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.open{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:24px;
}

.modal-box h2{
  margin-top:0;
}

.preview-img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  margin:4px;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

  <div class="card login">

    <h2>KalaaBook Admin</h2>

    <p>Admin Login</p>

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin email"
    >

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="login()">
      Login
    </button>

    <p
      id="loginMessage"
      class="message">
    </p>

  </div>

</div>


<!-- ADMIN -->

<div id="adminPage" class="hidden">

<header>

  <h1>KalaaBook Admin Dashboard</h1>

  <button
    class="red"
    onclick="logout()">
    Logout
  </button>

</header>


<!-- ADD ARTIST -->

<div class="card">

  <h2>Add Artist</h2>

  <p class="small">
    Add an artist manually and approve them immediately.
  </p>

  <button
    class="green"
    onclick="showAddArtist()">
    Add & Approve Artist
  </button>

</div>


<!-- ADD ARTIST FORM -->

<div
  id="addArtistBox"
  class="card hidden">

  <h2>Add & Approve Artist</h2>

  <label>Full Name</label>

  <input
    id="addName"
    placeholder="Artist name"
  >

  <label>WhatsApp</label>

  <input
    id="addWhatsapp"
    placeholder="+91..."
  >

  <label>City</label>

  <input
    id="addCity"
    placeholder="City"
  >

  <label>Area</label>

  <input
    id="addArea"
    placeholder="Area"
  >

  <label>Category</label>

  <select id="addCategory">

    <option value="Nail Art">
      Nail Art
    </option>

    <option value="Mehendi">
      Mehendi
    </option>

    <option value="Salon">
      Salon
    </option>

  </select>

  <label>Specialties</label>

  <input
    id="addSpecialties"
    placeholder="Nail Extension, Gel Nails, Nail Art"
  >

  <label>Experience</label>

  <input
    id="addExperience"
    placeholder="Example: 3 years"
  >

  <label>Bio / Notes</label>

  <textarea
    id="addNotes"
    placeholder="Artist bio">
  </textarea>

  <label>Instagram</label>

  <input
    id="addInstagram"
    placeholder="@username or Instagram URL"
  >

  <label>Services</label>

  <input
    id="addServices"
    placeholder="Nail Extension, Gel Nails, Nail Art"
  >

  <label>Profile Photo</label>

    type="file"
    id="addProfilePhoto"
    accept="image/*"

    type="file"
    id="addPortfolioPhotos"
    accept="image/*"

    class="green"

    Add & Approve Artist

  <button
    class="gray"
    onclick="hideAddArtist()">
    Cancel
  </button>

  <p
    id="addMessage"
    class="message">
  </p>

</div>


<!-- APPLICATIONS -->

<div class="card">

  <h2>Artist Applications</h2>

  <button
    class="primary"
    onclick="loadApplications()">
    Refresh
  </button>

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Date</th>
          <th>Name</th>
          <th>WhatsApp</th>
          <th>Location</th>
          <th>Category</th>
          <th>Specialties</th>
          <th>Experience</th>
          <th>Status</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="applicationsBody">

        <tr>

          <td colspan="10">
            Loading...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

</div>


<!-- EDIT MODAL -->

<div
  id="editModal"
  class="modal">

  <div class="modal-box">

    <h2>Edit Artist</h2>

    <input
      type="hidden"
      id="editId"
    >

    <label>Full Name</label>

    <input
      id="editName"
    >

    <label>WhatsApp</label>

    <input
      id="editWhatsapp"
    >

    <label>City</label>

    <input
      id="editCity"
    >

    <label>Area</label>

    <input
      id="editArea"
    >

    <label>Category</label>

    <select id="editCategory">

      <option value="Nail Art">
        Nail Art
      </option>

      <option value="Mehendi">
        Mehendi
      </option>

      <option value="Salon">
        Salon
      </option>

    </select>

    <label>Specialties</label>

    <input
      id="editSpecialties"
    >

    <label>Experience</label>

    <input
      id="editExperience"
    >

    <label>Bio / Notes</label>

    <textarea
      id="editNotes">
    </textarea>

    <label>Instagram</label>

    <input
      id="editInstagram"
    >

    <label>Services</label>

    <input
      id="editServices"
      placeholder="Nail Extension, Gel Nails, Nail Art"
    >

    <p
      id="editMessage"
      class="message">
    </p>

    <button
      class="green"
      onclick="saveEdit()">
      Save Changes
    </button>

    <button
      class="gray"
      onclick="closeEdit()">
      Cancel
    </button>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
'https://pmerqsrmgmlqirznegeb.supabase.co';

const SUPABASE_KEY =
'sb_publishable_QreawwcE_0ebjswoBAHrig_IxzryR5p';


let ACCESS_TOKEN = '';

let CURRENT_ARTIST = null;


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById('loginEmail').value.trim();

  const password =
    document.getElementById('loginPassword').value;

  const msg =
    document.getElementById('loginMessage');

  msg.textContent = 'Logging in...';

  try{

    const response = await fetch(
      SUPABASE_URL +
      '/auth/v1/token?grant_type=password',
      {
        method:'POST',

        headers:{
          'apikey':SUPABASE_KEY,
          'Content-Type':'application/json'
        },

      body:JSON.stringify({
  email: email,
  password: password
})
      }
    );

    const data = await response.json();

    if(!response.ok){

      msg.textContent =
        data.error_description ||
        data.msg ||
        'Login failed';

      return;
    }

    ACCESS_TOKEN =
      data.access_token;

    sessionStorage.setItem(
      'kalaa_admin_token',
      ACCESS_TOKEN
    );

    document
      .getElementById('loginPage')
      .classList.add('hidden');

    document
      .getElementById('adminPage')
      .classList.remove('hidden');

    loadApplications();

  }catch(error){

    msg.textContent =
      'Login error: ' + error.message;

  }

}


/* =========================
   AUTO LOGIN
========================= */

window.addEventListener('load',function(){

  const saved =
    sessionStorage.getItem(
      'kalaa_admin_token'
    );

  if(saved){

    ACCESS_TOKEN = saved;

    document
      .getElementById('loginPage')
      .classList.add('hidden');

    document
      .getElementById('adminPage')
      .classList.remove('hidden');

    loadApplications();

  }

});


/* =========================
   LOGOUT
========================= */

function logout(){

  ACCESS_TOKEN = '';

  sessionStorage.removeItem(
    'kalaa_admin_token'
  );

  location.reload();

}


/* =========================
   SUPABASE HEADERS
========================= */

function authHeaders(){

  return {

    'apikey':SUPABASE_KEY,

    'Authorization':
      'Bearer ' + ACCESS_TOKEN,

    'Content-Type':
      'application/json'

  };

}


/* =========================
   LOAD APPLICATIONS
========================= */

async function loadApplications(){

  const body =
    document.getElementById(
      'applicationsBody'
    );

  body.innerHTML =
    '<tr><td colspan="10">Loading...</td></tr>';

  try{

    const response = await fetch(

      SUPABASE_URL +
      '/rest/v1/artist_applications' +
      '?select=*' +
      '&order=created_at.desc',

      {
        headers:authHeaders()
      }

    );

    if(!response.ok){

      const error =
        await response.text();

      body.innerHTML =
        '<tr><td colspan="10">Error loading applications.</td></tr>';

      console.error(error);

      return;
    }

    const apps =
      await response.json();

    if(!apps.length){

      body.innerHTML =
        '<tr><td colspan="10">No applications yet.</td></tr>';

      return;
    }

    body.innerHTML = '';

    apps.forEach(function(app){

      const tr =
        document.createElement('tr');

      const date =
        app.created_at
          ? new Date(
              app.created_at
            ).toLocaleString()
          : '';

      const status =
        app.status || 'pending';

      tr.innerHTML = `

        <td>${escapeHtml(app.id)}</td>

        <td>${escapeHtml(date)}</td>

        <td>
          <strong>
            ${escapeHtml(app.full_name || '')}
          </strong>
        </td>

        <td>
          ${escapeHtml(app.whatsapp || '')}
        </td>

        <td>
          ${escapeHtml(app.city || '')}
          ${app.area ? '<br>' + escapeHtml(app.area) : ''}
        </td>

        <td>
          ${escapeHtml(app.category || '')}
        </td>

        <td>
          ${escapeHtml(app.specialties || '')}
        </td>

        <td>
          ${escapeHtml(app.experience || '')}
        </td>

        <td>
          <span class="status ${status}">
            ${escapeHtml(status)}
          </span>
        </td>

        <td class="actions">

          <button
            class="green"
            onclick="updateStatus(${app.id},'approved')">
            Approve
          </button>

        <button
  class="primary"
  onclick="copyUploadLink(${app.id}, '${app.upload_token || ''}')">
  Copy Upload Link
</button>

          <br>

          <button
            class="primary"
            onclick="openEdit(${app.id})">
            Edit Artist
          </button>

          <br>

          <input
            type="file"
            id="profile-${app.id}"
            accept="image/*"
            class="photo-input"
          >

          <button
            class="primary"
            onclick="uploadProfilePhoto(${app.id})">
            Upload Profile Photo
          </button>

          <br>

          <input
            type="file"
            id="portfolio-${app.id}"
            accept="image/*"
            multiple
            class="photo-input"
          >

          <button
            class="primary"
            onclick="uploadPortfolioPhotos(${app.id})">
            Upload Portfolio Photos
          </button>

          <p class="small">
            Profile: 1 photo<br>
            Portfolio: maximum 6 photos
          </p>

        </td>

      `;

      body.appendChild(tr);

    });

  }catch(error){

    console.error(error);

    body.innerHTML =
      '<tr><td colspan="10">Connection error.</td></tr>';

  }

}


/* =========================
   UPDATE STATUS
========================= */

async function updateStatus(id,status){

  const message =
    status === 'approved'
      ? 'Approve this artist?'
      : 'Reject this artist?';

  if(!confirm(message)) return;

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications?id=eq.' +
        encodeURIComponent(id),

        {
          method:'PATCH',

          headers:{
            ...authHeaders(),
            'Prefer':'return=minimal'
          },

        body:JSON.stringify({
  status: status,
  upload_token:
    status === 'approved'
      ? crypto.randomUUID()
      : null
})

        }

      );

    if(!response.ok){

      const error =
        await response.text();

      alert(
        'Could not update status.\n' +
        error
      );

      return;
    }

    alert(
      status === 'approved'
        ? 'Artist approved!'
        : 'Artist rejected!'
    );

    loadApplications();

  }catch(error){

    alert(
      'Error: ' + error.message
    );

  }

}


/* =========================
   ADD ARTIST UI
========================= */

function showAddArtist(){

  document
    .getElementById('addArtistBox')
    .classList.remove('hidden');

}

function hideAddArtist(){

  document
    .getElementById('addArtistBox')
    .classList.add('hidden');

}


/* =========================
   ADD ARTIST
========================= */

async function addArtist(){

  const msg =
    document.getElementById(
      'addMessage'
    );

  const name =
    document.getElementById(
      'addName'
    ).value.trim();

  if(!name){

    msg.textContent =
      'Artist name is required.';

    return;
  }

  msg.textContent =
    'Adding artist...';

  const servicesText =
    document.getElementById(
      'addServices'
    ).value.trim();

  const services =
    servicesText
      ? servicesText
          .split(',')
          .map(function(x){
            return x.trim();
          })
          .filter(Boolean)
      : [];

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications',

        {
          method:'POST',

          headers:{
            ...authHeaders(),
            'Prefer':
              'return=representation'
          },

          body:JSON.stringify({

            full_name:name,

            whatsapp:
              document.getElementById(
                'addWhatsapp'
              ).value.trim(),

            city:
              document.getElementById(
                'addCity'
              ).value.trim(),

            area:
              document.getElementById(
                'addArea'
              ).value.trim(),

            category:
              document.getElementById(
                'addCategory'
              ).value,

            specialties:
              document.getElementById(
                'addSpecialties'
              ).value.trim(),

            experience:
              document.getElementById(
                'addExperience'
              ).value.trim(),

            notes:
              document.getElementById(
                'addNotes'
              ).value.trim(),

            portfolio:
              document.getElementById(
                'addInstagram'
              ).value.trim(),

            services:services,

            status:'approved',

            consent:true

          })

        }

      );

    if(!response.ok){

      const error =
        await response.text();

      msg.textContent =
        'Could not add artist: ' +
        error;

      return;
    }

    const created =
      await response.json();

    const artist =
      created[0];

    const id =
      artist.id;

    /* PROFILE PHOTO */

    const profileInput =
      document.getElementById(
        'addProfilePhoto'
      );

    if(
      profileInput.files &&
      profileInput.files.length
    ){

      await uploadFileToArtist(
        id,
        profileInput.files[0],
        'profile'
      );

    }


    /* PORTFOLIO */

    const portfolioInput =
      document.getElementById(
        'addPortfolioPhotos'
      );

    const files =
      Array.from(
        portfolioInput.files || []
      ).slice(0,6);

    const urls = [];

    for(
      let i=0;
      i<files.length;
      i++
    ){

      const url =
        await uploadFileToArtist(
          id,
          files[i],
          'portfolio',
          i
        );

      if(url) urls.push(url);

    }

    if(urls.length){

      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications?id=eq.' +
        id,

        {
          method:'PATCH',

          headers:{
            ...authHeaders(),
            'Prefer':
              'return=minimal'
          },

          body:JSON.stringify({
            portfolio_photos:urls
          })

        }

      );

    }

    alert(
      'Artist added and approved successfully!'
    );

    hideAddArtist();

    clearAddForm();

    loadApplications();

  }catch(error){

    msg.textContent =
      'Error: ' + error.message;

  }

}


/* =========================
   CLEAR ADD FORM
========================= */

function clearAddForm(){

  const ids = [

    'addName',
    'addWhatsapp',
    'addCity',
    'addArea',
    'addSpecialties',
    'addExperience',
    'addNotes',
    'addInstagram',
    'addServices'

  ];

  ids.forEach(function(id){

    document.getElementById(
      id
    ).value = '';

  });

  document.getElementById(
    'addProfilePhoto'
  ).value = '';

  document.getElementById(
    'addPortfolioPhotos'
  ).value = '';

}


/* =========================
   UPLOAD FILE
========================= */

async function uploadFileToArtist(
  id,
  file,
  type,
  index
){

  if(!file) return '';

  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g,'-');

  const timestamp =
    Date.now();

  let filename;

  if(type === 'profile'){

    filename =
      'artists/' +
      id +
      '-profile-' +
      timestamp +
      '-' +
      safeName;

  }else{

    filename =
      'artists/' +
      id +
      '-portfolio-' +
      timestamp +
      '-' +
      index +
      '-' +
      safeName;

  }

  const upload =
    await fetch(

      SUPABASE_URL +
      '/storage/v1/object/artist-photos/' +
      filename,

      {
        method:'POST',

        headers:{
          'apikey':SUPABASE_KEY,
          'Authorization':
            'Bearer ' + ACCESS_TOKEN,
          'Content-Type':
            file.type || 'application/octet-stream'
        },

        body:file

      }

    );

  if(!upload.ok){

    const error =
      await upload.text();

    throw new Error(
      'Photo upload failed: ' +
      error
    );

  }

  return (
    SUPABASE_URL +
    '/storage/v1/object/public/artist-photos/' +
    filename
  );

}


/* =========================
   PROFILE PHOTO
========================= */

async function uploadProfilePhoto(id){

  const input =
    document.getElementById(
      'profile-' + id
    );

  if(
    !input ||
    !input.files ||
    !input.files.length
  ){

    alert(
      'Please select a profile photo first.'
    );

    return;
  }

  try{

    const file =
      input.files[0];

    const url =
      await uploadFileToArtist(
        id,
        file,
        'profile',
        0
      );

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications?id=eq.' +
        id,

        {
          method:'PATCH',

          headers:{
            ...authHeaders(),
            'Prefer':
              'return=minimal'
          },

          body:JSON.stringify({
            profile_photo:url
          })

        }

      );

    if(!response.ok){

      const error =
        await response.text();

      alert(
        'Could not save profile photo.\n' +
        error
      );

      return;
    }

    alert(
      'Profile photo uploaded successfully!'
    );

    input.value = '';

    loadApplications();

  }catch(error){

    alert(
      'Upload error: ' +
      error.message
    );

  }

}


/* =========================
   PORTFOLIO PHOTOS
========================= */

async function uploadPortfolioPhotos(id){

  const input =
    document.getElementById(
      'portfolio-' + id
    );

  if(
    !input ||
    !input.files ||
    !input.files.length
  ){

    alert(
      'Please select portfolio photos first.'
    );

    return;
  }

  const files =
    Array.from(
      input.files
    ).slice(0,6);

  if(input.files.length > 6){

    alert(
      'Maximum 6 photos can be selected.'
    );

  }

  try{

    const getResponse =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications?id=eq.' +
        id +
        '&select=portfolio_photos',

        {
          headers:authHeaders()
        }

      );

    const existingData =
      await getResponse.json();

    const existing =
      Array.isArray(
        existingData[0]?.portfolio_photos
      )
        ? existingData[0].portfolio_photos
        : [];

    if(
      existing.length +
      files.length > 6
    ){

      alert(
        'This artist already has ' +
        existing.length +
        ' portfolio photos. Maximum is 6.'
      );

      return;

    }

    const newUrls = [];

    for(
      let i=0;
      i<files.length;
      i++
    ){

      const url =
        await uploadFileToArtist(
          id,
          files[i],
          'portfolio',
          i
        );

      if(url){
        newUrls.push(url);
      }

    }

    const combined =
      existing.concat(newUrls);

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications?id=eq.' +
        id,

        {
          method:'PATCH',

          headers:{
            ...authHeaders(),
            'Prefer':
              'return=minimal'
          },

          body:JSON.stringify({
            portfolio_photos:combined
          })

        }

      );

    if(!response.ok){

      const error =
        await response.text();

      alert(
        'Could not save portfolio photos.\n' +
        error
      );

      return;
    }

    alert(
      'Portfolio photos uploaded successfully!'
    );

    input.value = '';

    loadApplications();

  }catch(error){

    alert(
      'Upload error: ' +
      error.message
    );

  }

}


/* =========================
   OPEN EDIT
========================= */

async function openEdit(id){

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications?id=eq.' +
        id +
        '&select=*',

        {
          headers:authHeaders()
        }

      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.length
    ){

      alert(
        'Artist not found.'
      );

      return;
    }

    const a =
      data[0];

    CURRENT_ARTIST = a;

    document.getElementById(
      'editId'
    ).value = a.id;

    document.getElementById(
      'editName'
    ).value = a.full_name || '';

    document.getElementById(
      'editWhatsapp'
    ).value = a.whatsapp || '';

    document.getElementById(
      'editCity'
    ).value = a.city || '';

    document.getElementById(
      'editArea'
    ).value = a.area || '';

    document.getElementById(
      'editCategory'
    ).value = a.category || 'Nail Art';

    document.getElementById(
      'editSpecialties'
    ).value = a.specialties || '';

    document.getElementById(
      'editExperience'
    ).value = a.experience || '';

    document.getElementById(
      'editNotes'
    ).value = a.notes || '';

    document.getElementById(
      'editInstagram'
    ).value = a.portfolio || '';

    let services = '';

    if(
      Array.isArray(a.services)
    ){

      services =
        a.services.join(', ');

    }

    document.getElementById(
      'editServices'
    ).value = services;

    document.getElementById(
      'editMessage'
    ).textContent = '';

    document.getElementById(
      'editModal'
    ).classList.add('open');

  }catch(error){

    alert(
      'Error loading artist: ' +
      error.message
    );

  }

}


/* =========================
   SAVE EDIT
========================= */

async function saveEdit(){

  const id =
    document.getElementById(
      'editId'
    ).value;

  const msg =
    document.getElementById(
      'editMessage'
    );

  const servicesText =
    document.getElementById(
      'editServices'
    ).value.trim();

  const services =
    servicesText
      ? servicesText
          .split(',')
          .map(function(x){
            return x.trim();
          })
          .filter(Boolean)
      : [];

  msg.textContent =
    'Saving...';

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        '/rest/v1/artist_applications?id=eq.' +
        encodeURIComponent(id),

        {
          method:'PATCH',

          headers:{
            ...authHeaders(),
            'Prefer':
              'return=minimal'
          },

          body:JSON.stringify({

            full_name:
              document.getElementById(
                'editName'
              ).value.trim(),

            whatsapp:
              document.getElementById(
                'editWhatsapp'
              ).value.trim(),

            city:
              document.getElementById(
                'editCity'
              ).value.trim(),

            area:
              document.getElementById(
                'editArea'
              ).value.trim(),

            category:
              document.getElementById(
                'editCategory'
              ).value,

            specialties:
              document.getElementById(
                'editSpecialties'
              ).value.trim(),

            experience:
              document.getElementById(
                'editExperience'
              ).value.trim(),

            notes:
              document.getElementById(
                'editNotes'
              ).value.trim(),

            portfolio:
              document.getElementById(
                'editInstagram'
              ).value.trim(),

            services:services

          })

        }

      );

    if(!response.ok){

      const error =
        await response.text();

      msg.textContent =
        'Could not save: ' +
        error;

      return;
    }

    alert(
      'Artist updated successfully!'
    );

    closeEdit();

    loadApplications();

  }catch(error){

    msg.textContent =
      'Error: ' +
      error.message;

  }

}


/* =========================
   CLOSE EDIT
========================= */

function closeEdit(){

  document
    .getElementById('editModal')
    .classList.remove('open');

  CURRENT_ARTIST = null;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}
function copyUploadLink(id, token){

  if(!token){

    alert(
      'This artist does not have an upload token yet. Please approve the artist again.'
    );

    return;
  }

  const link =
    window.location.origin +
    '/artist?token=' +
    encodeURIComponent(token);

  navigator.clipboard.writeText(link)
    .then(function(){

      alert(
        'Upload link copied!\n\n' +
        link
      );

    })
    .catch(function(){

      prompt(
        'Copy this artist upload link:',
        link
      );

    });

}
