


<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="noindex, nofollow" name="robots"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KalaaBook Admin</title>
<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:22px;
}

button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:600;
  margin:3px;
}

.green{
  background:#198754;
  color:white;
}

.red{
  background:#dc3545;
  color:white;
}

.primary{
  background:#2563eb;
  color:white;
}

.gray{
  background:#777;
  color:white;
}

.card{
  background:white;
  margin:20px auto;
  padding:20px;
  border-radius:12px;
  max-width:1400px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.login{
  max-width:420px;
  margin:80px auto;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:14px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  font-weight:600;
  display:block;
  margin-top:8px;
}

.message{
  margin-top:10px;
  font-weight:600;
}

.hidden{
  display:none;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid #ddd;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f1f1f1;
}

.status{
  font-weight:bold;
}

.status.approved{
  color:#198754;
}

.status.rejected{
  color:#dc3545;
}

.status.pending{
  color:#d97706;
}

.actions{
  min-width:260px;
}

.small{
  font-size:12px;
  color:#666;
}

.photo-input{
  margin-top:8px;
  width:220px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.open{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:24px;
}

.modal-box h2{
  margin-top:0;
}

.preview-img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  margin:4px;
}

</style>
<style>
:root{--accent:#a84629;--ink:#252723;--muted:#6e746e;--line:#e5e4dc}body{background:#f6f5ef;color:var(--ink);font:14px Arial,Helvetica,sans-serif}.hidden,[hidden]{display:none!important}button{font-size:13px;padding:11px 15px}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d47d55;outline-offset:3px}.primary{background:var(--accent)}.green{background:#27674b}.gray{background:#616962}input,select,textarea{border-color:#d8dcd3;background:#fcfcf9}label{font-size:13px;color:#555e53}.small{line-height:1.7}.card{box-shadow:none;border:1px solid var(--line);border-radius:15px}.logo{width:180px;height:85px;object-fit:contain;background:#f0e8d9;border-radius:10px}#adminPage{padding-left:230px;min-height:100vh}#sidebar{position:fixed;inset:0 auto 0 0;width:230px;background:#232a25;color:#fff;padding:24px 16px;z-index:20}#sidebar .logo{width:100%;height:100px}#sidebar p{font-size:11px;letter-spacing:2px;color:#c1c8bc;text-align:center;margin-bottom:35px}#sidebar button{display:block;width:100%;text-align:left;color:#e3e8df;background:none;padding:14px;margin:7px 0}#sidebar button.active,#sidebar button:hover{background:#3e4a3e}header{background:white;color:var(--ink);border-bottom:1px solid var(--line);padding:20px 28px}header h1{font-size:19px}#adminPage>.card,#overview{margin:24px 28px;max-width:none;padding:24px}#overview{padding:0}#overview h2{font-size:27px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}.stat{padding:22px;background:white;border:1px solid var(--line);border-top:4px solid #b96543;border-radius:12px}.stat:nth-child(2){border-top-color:#b4872e}.stat:nth-child(3){border-top-color:#39775a}.stat:nth-child(4){border-top-color:#657f9b}.stat strong{font-size:32px;display:block;margin:14px 0}.stat small{color:var(--muted)}.graphs{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.graph{background:white;border:1px solid var(--l .drawer .preview-img{width:90px;height:90px}.modal{z-index:200}#loginPage{min-height:100vh;padding:35px;display:grid;place-items:center;background:radial-gradient(at top left,#e6d9bd,transparent 65%),#f4f0e5}.login{width:100%;max-width:470px;margin:0;padding:36px;border-radius:20px;box-shadow:0 20px 70px #35332212}.login .logo{width:220px;height:110px;display:block;margin:0 auto 24px}.login h2{font-size:26px}.login>button.primary{width:100%;margin:15px 0}.login p{color:var(--muted)}#passwordToggle{background:none;color:var(--accent);padding:3px 0;margin:0 0 10px}.login input{padding:14px}.preview-img{object-fit:cover}#addArtistBox{max-width:800px!important}

@media(max-width:700px){#adminPage{padding:0}#sidebar{position:relative;width:100%;padding:15px;display:flex;flex-wrap:wrap;gap:5px}#sidebar .logo{width:130px;height:60px}#sidebar p{display:none}#sidebar button{width:auto;margin:0;padding:10px;font-size:12px}header{padding:15px}header h1{font-size:16px}#adminPage>.card,#overview{margin:16px;padding:16px}#overview{padding:0}.stat{padding:16px}.stats{gap:10px}.stat strong{font-size:27px}#loginPage{padding:18px}.login{padding:26px}.facts{grid-template-columns:1fr}.drawer{padding:20px}}
