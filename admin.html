<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KalaaBook Admin</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:30px;
  color:#222;
}

.container{
  max-width:1100px;
  margin:auto;
}

h1{
  margin-bottom:5px;
}

button{
  border:0;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#111;
  color:white;
}

.green{
  background:#198754;
  color:white;
}

.red{
  background:#dc3545;
  color:white;
}

.gray{
  background:#ddd;
}

.card{
  background:white;
  padding:25px;
  border-radius:14px;
  margin-top:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  margin-top:6px;
  margin-bottom:14px;
  border:1px solid #ccc;
  border-radius:7px;
}

label{
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #ddd;
  text-align:left;
  vertical-align:top;
}

.status{
  font-weight:bold;
}

#dashboard{
  display:none;
}

#addArtist{
  display:none;
}

.message{
  margin-top:10px;
  font-weight:bold;
}

.actions button{
  margin-right:5px;
  margin-bottom:5px;
}
</style>

</head>

<body>

<div class="container">

<h1>KalaaBook Admin</h1>

<p>Manage artist applications and artists.</p>


<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>Admin Login</h2>

<label>Email</label>
<input id="email" type="email" placeholder="Admin email">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="login()">Login</button>

<p id="loginMessage" class="message"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<div style="margin-top:20px;">

<button class="primary" onclick="showAddArtist()">
+ Add Artist
</button>

<button class="gray" onclick="loadApplications()">
Refresh
</button>

<button class="red" onclick="logout()">
Logout
</button>

</div>


<!-- ADD ARTIST -->

<div id="addArtist" class="card">

<h2>Add Artist Manually</h2>

<label>Full Name</label>
<input id="artistName" type="text">

<label>WhatsApp</label>
<input id="artistWhatsapp" type="text">

<label>City</label>
<input id="artistCity" type="text">

<label>Area</label>
<input id="artistArea" type="text">

<label>Category</label>

<select id="artistCategory">

<option value="">Select category</option>
<option>Nail Art</option>
<option>Mehendi</option>
<option>Salon</option>

</select>


<label>Specialties</label>

<input
id="artistSpecialties"
type="text"
placeholder="Example: Bridal Mehendi, Arabic Mehendi"
>


<label>Experience</label>

<input
id="artistExperience"
type="text"
placeholder="Example: 5 years"
>


<label>Portfolio / Instagram</label>

<input
id="artistPortfolio"
type="text"
placeholder="Instagram username or link"
>


<label>Work Mode</label>

<select id="artistWorkMode">

<option value="">Select</option>
<option>Home</option>
<option>Studio</option>
<option>Both</option>

</select>


<label>Booking Volume</label>

<input
id="artistBookings"
type="text"
placeholder="Example: 10-20 bookings/month"
>


<label>Team Size</label>

<input
id="artistTeamSize"
type="text"
placeholder="Example: 2"
>


<label>Notes</label>

<textarea id="artistNotes"></textarea>


<label>Profile Photo</label>

<input
id="artistProfilePhoto"
type="file"
accept="image/*"
>


<label>Portfolio Photos</label>

<input
id="artistPortfolioPhotos"
type="file"
accept="image/*"
multiple
>


<p style="font-size:13px;color:#666;">
Profile photo: 1 image. Portfolio: up to 6 images.
</p>

<br>


<button class="green" onclick="addArtist()">
Add & Approve Artist
</button>

<button class="gray" onclick="hideAddArtist()">
Cancel
</button>

<p id="addMessage" class="message"></p>

</div>


<!-- APPLICATIONS -->

<div class="card">

<h2>Artist Applications</h2>

<p id="loading">
Loading applications...
</p>

<table id="applicationsTable">

<thead>

<tr>
<th>Name</th>
<th>Category</th>
<th>City</th>
<th>WhatsApp</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="applicationsBody"></tbody>

</table>

</div>

</div>

</div>


<script>

/* SUPABASE SETTINGS */

const SUPABASE_URL =
'https://pmerqsrmgmlqirznegeb.supabase.co';

const SUPABASE_KEY =
'sb_publishable_QreawwcE_0ebjswoBAHrig_IxzryR5p';


let accessToken = null;


/* LOGIN */

async function login(){

const email =
document.getElementById('email').value.trim();

const password =
document.getElementById('password').value;

const msg =
document.getElementById('loginMessage');

msg.textContent='Logging in...';

try{

const response = await fetch(
SUPABASE_URL +
'/auth/v1/token?grant_type=password',
{
method:'POST',

headers:{
'Content-Type':'application/json',
'apikey':SUPABASE_KEY
},

body:JSON.stringify({
email:email,
password:password
})
}
);

const data = await response.json();

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
'Login failed'
);

}

accessToken = data.access_token;

document.getElementById('loginBox')
.style.display='none';

document.getElementById('dashboard')
.style.display='block';

loadApplications();

}catch(error){

msg.textContent=error.message;

}

}


/* LOAD APPLICATIONS */

async function loadApplications(){

const loading =
document.getElementById('loading');

const body =
document.getElementById('applicationsBody');

loading.textContent='Loading applications...';

try{

const response = await fetch(

SUPABASE_URL +
'/rest/v1/artist_applications?select=*&order=created_at.desc',

{
headers:{
'apikey':SUPABASE_KEY,
'Authorization':'Bearer '+accessToken
}
}

);

const data = await response.json();

if(!response.ok){

throw new Error(
data.message ||
'Could not load applications'
);

}

body.innerHTML='';

if(data.length===0){

body.innerHTML=
'<tr><td colspan="6">No applications yet.</td></tr>';

}else{

data.forEach(app => {

const row =
document.createElement('tr');

row.innerHTML=`

<td>
<strong>
${escapeHtml(app.full_name || '')}
</strong>
</td>

<td>
${escapeHtml(app.category || '')}
</td>

<td>
${escapeHtml(app.city || '')}
</td>

<td>
${escapeHtml(app.whatsapp || '')}
</td>

<td class="status">
${escapeHtml(app.status || 'pending')}
</td>

<td class="actions">

<button
class="green"
onclick="updateStatus(${app.id},'approved')">
Approve
</button>

<button
class="red"
onclick="updateStatus(${app.id},'rejected')">
Reject
</button>

</td>

`;

body.appendChild(row);

});

}

loading.textContent='';

}catch(error){

loading.textContent=
'Error: '+error.message;

}

}


/* APPROVE / REJECT */

async function updateStatus(id,status){

try{

const response = await fetch(

SUPABASE_URL +
'/rest/v1/artist_applications?id=eq.' +
id,

{
method:'PATCH',

headers:{
'apikey':SUPABASE_KEY,
'Authorization':'Bearer '+accessToken,
'Content-Type':'application/json',
'Prefer':'return=minimal'
},

body:JSON.stringify({
status:status
})

}

);

if(!response.ok){

const error =
await response.json();

throw new Error(
error.message ||
'Could not update status'
);

}

loadApplications();

}catch(error){

alert(error.message);

}

}


/* SHOW ADD ARTIST */

function showAddArtist(){

document.getElementById('addArtist')
.style.display='block';

window.scrollTo({
top:document.getElementById('addArtist')
.offsetTop,
behavior:'smooth'
});

}


/* HIDE ADD ARTIST */

function hideAddArtist(){

document.getElementById('addArtist')
.style.display='none';

}


/* ADD ARTIST */

async function addArtist(){

const message =
document.getElementById('addMessage');

message.textContent='Adding artist...';


const profilePhoto =
document.getElementById(
'artistProfilePhoto'
).files[0];


const portfolioPhotos =
document.getElementById(
'artistPortfolioPhotos'
).files;


if(portfolioPhotos.length > 6){

message.textContent=
'Please select a maximum of 6 portfolio photos.';

return;

}


const artist={

full_name:
document.getElementById(
'artistName'
).value.trim(),

whatsapp:
document.getElementById(
'artistWhatsapp'
).value.trim(),

city:
document.getElementById(
'artistCity'
).value.trim(),

area:
document.getElementById(
'artistArea'
).value.trim(),

category:
document.getElementById(
'artistCategory'
).value,

specialties:
document.getElementById(
'artistSpecialties'
).value.trim(),

experience:
document.getElementById(
'artistExperience'
).value.trim(),

portfolio:
document.getElementById(
'artistPortfolio'
).value.trim(),

work_mode:
document.getElementById(
'artistWorkMode'
).value,

bookings:
document.getElementById(
'artistBookings'
).value.trim(),

team_size:
document.getElementById(
'artistTeamSize'
).value.trim(),

notes:
document.getElementById(
'artistNotes'
).value.trim(),

consent:true,

updates:false,

status:'approved',

services:[]

};


if(!artist.full_name){

message.textContent=
'Please enter the artist name.';

return;

}


try{

let profilePhotoUrl='';

let portfolioPhotoUrls=[];


/* PROFILE PHOTO */

if(profilePhoto){

const profilePath=
'artists/' +
Date.now() +
'-profile-' +
profilePhoto.name.replace(
/[^a-zA-Z0-9._-]/g,
'_'
);


const upload =
await fetch(

SUPABASE_URL +
'/storage/v1/object/artist-photos/' +
profilePath,

{
method:'POST',

headers:{
'apikey':SUPABASE_KEY,
'Authorization':
'Bearer '+accessToken,
'Content-Type':
profilePhoto.type
},

body:profilePhoto

}

);


if(!upload.ok){

const error =
await upload.json();

throw new Error(
error.message ||
'Profile photo upload failed'
);

}


profilePhotoUrl=

SUPABASE_URL +
'/storage/v1/object/public/artist-photos/' +
profilePath;

}


/* PORTFOLIO PHOTOS */

for(
let i=0;
i<portfolioPhotos.length;
i++
){

const photo =
portfolioPhotos[i];

const photoPath=
'artists/' +
Date.now() +
'-portfolio-' +
i +
'-' +
photo.name.replace(
/[^a-zA-Z0-9._-]/g,
'_'
);


const upload =
await fetch(

SUPABASE_URL +
'/storage/v1/object/artist-photos/' +
photoPath,

{
method:'POST',

headers:{
'apikey':SUPABASE_KEY,
'Authorization':
'Bearer '+accessToken,
'Content-Type':
photo.type
},

body:photo

}

);


if(!upload.ok){

const error =
await upload.json();

throw new Error(
error.message ||
'Portfolio photo upload failed'
);

}


portfolioPhotoUrls.push(

SUPABASE_URL +
'/storage/v1/object/public/artist-photos/' +
photoPath

);

}


/* PHOTO URLS */

artist.profile_photo =
profilePhotoUrl;

artist.portfolio_photos =
portfolioPhotoUrls;


/* INSERT ARTIST */

const response =
await fetch(

SUPABASE_URL +
'/rest/v1/artist_applications',

{
method:'POST',

headers:{
'apikey':SUPABASE_KEY,
'Authorization':
'Bearer '+accessToken,
'Content-Type':
'application/json',
'Prefer':'return=minimal'
},

body:JSON.stringify(artist)

}

);


if(!response.ok){

const error =
await response.json();

throw new Error(
error.message ||
'Could not add artist'
);

}


message.textContent=
'Artist added successfully!';


clearArtistForm();

loadApplications();


}catch(error){

message.textContent=
'Error: '+error.message;

}

}


/* CLEAR FORM */

function clearArtistForm(){

document.getElementById(
'artistName'
).value='';

document.getElementById(
'artistWhatsapp'
).value='';

document.getElementById(
'artistCity'
).value='';

document.getElementById(
'artistArea'
).value='';

document.getElementById(
'artistCategory'
).value='';

document.getElementById(
'artistSpecialties'
).value='';

document.getElementById(
'artistExperience'
).value='';

document.getElementById(
'artistPortfolio'
).value='';

document.getElementById(
'artistWorkMode'
).value='';

document.getElementById(
'artistBookings'
).value='';

document.getElementById(
'artistTeamSize'
).value='';

document.getElementById(
'artistNotes'
).value='';

document.getElementById(
'artistProfilePhoto'
).value='';

document.getElementById(
'artistPortfolioPhotos'
).value='';

}


/* LOGOUT */

function logout(){

accessToken=null;

document.getElementById(
'dashboard'
).style.display='none';

document.getElementById(
'loginBox'
).style.display='block';

}


/* SECURITY */

function escapeHtml(value){

return String(value)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}

</script>

</body>
</html>
